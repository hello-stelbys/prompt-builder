
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Builder</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #60a5fa; }
    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 24px;
      margin-top: 30px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Prompt Builder</h1>
  <p>画像生成プロンプト作成アプリ</p>

  <div class="card">
    <h2>アプリ開発スタート！</h2>
    <p>GitHub Pagesで動作確認中</p>
    <button onclick="alert('動作成功！')">
      動作テスト
    </button>
  </div>
</body>
</html>
