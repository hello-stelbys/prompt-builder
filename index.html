<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#0b1020;color:#edf2ff}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:18px 15px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:15px 0 10px}.sub{color:#9eabc4;font-size:12px}.card{background:#161e30;border:1px solid #34405a;border-radius:16px;padding:16px;margin:12px 0}.stack>*+*{margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}label{display:block;font-size:13px;color:#b9c8e2;margin-bottom:6px}input,textarea,select,button{font:inherit}input:not([type=checkbox]),textarea,select{display:block;width:100%;background:#0c1425;border:1px solid #3b4b69;border-radius:10px;padding:11px;color:#f1f5ff;font-size:15px;min-height:44px}textarea{min-height:94px;resize:vertical}input[type=checkbox]{width:20px;height:20px;accent-color:#6593ff}.check{display:flex;align-items:center;gap:8px}.check label{margin:0}.btn{background:#4c7fe9;border:0;color:#fff;border-radius:10px;padding:12px 15px;font-weight:600;cursor:pointer}.btn.alt{background:#2e3d57}.btn.danger{background:#743b4c}.btn:disabled{opacity:.5}.full{width:100%}.grow{flex:1}.tiny{font-size:12px;padding:9px}.output{white-space:pre-wrap;overflow-wrap:anywhere;max-height:370px;overflow:auto;background:#0b1425;border:1px solid #34405a;padding:14px;border-radius:12px;line-height:1.65;font-size:13px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#10182a;border-top:1px solid #33435d;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;max-width:200px;background:none;color:#9aaac7;border:0;padding:10px 2px;border-radius:10px;font-size:12px}.tabs button.active{background:#294575;color:#fff}.hidden{display:none!important}.hint{font-size:12px;color:#a5b2cc;line-height:1.65}.notice{padding:11px;border-radius:9px;background:#263b52;font-size:13px;white-space:pre-wrap}.badge{border:1px solid #3c577e;padding:5px 8px;border-radius:20px;color:#bdd5ff;font-size:11px}hr{border:0;border-top:1px solid #33425b;margin:16px 0}@media(max-width:380px){.grid{grid-template-columns:1fr}.card{padding:13px}}
</style></head><body><main><header><div><h1>✦ Prompt Builder</h1><div class="sub">Ver.4.6 · Webアプリ版</div></div><span class="badge" id="saveStatus">読み込み中</span></header>
<section id="page-create"><div class="card stack"><h2>プロンプト作成</h2><div class="grid"><div><label>作成モード</label><select id="mode"><option value="normal">通常画像生成</option><option value="master">マスターシート</option></select></div><div><label>出力言語</label><select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></div></div><div class="check"><input type="checkbox" id="reference"><label for="reference">参照画像の人物を維持する</label></div><div id="refArea"><label>参照画像の優先範囲</label><select id="refMode"><option value="face">顔・容姿</option><option value="body">顔＋体型</option></select><p class="hint">画像自体はこのアプリからChatGPTに自動添付されません。画像生成時に別途添付してください。</p></div><div id="normalArea"><div class="grid" id="selectors"></div><div style="margin-top:14px"><label>自由入力・追加指示</label><textarea id="extra" placeholder="追加の指示を入力"></textarea></div></div><div id="masterArea" class="hidden stack"><div><label>マスターシートの種類</label><select id="sheetId"></select></div><div><label>画風</label><select id="sheetStyle"><option value="photo">実写</option><option value="anime">二次元</option></select></div><div><label>追加指示</label><textarea id="sheetExtra"></textarea></div></div></div><div class="card stack"><div class="row between"><h2 style="margin:0">完成プロンプト</h2><span class="badge" id="promptCount"></span></div><div class="output" id="output"></div><button class="btn full" id="copyPrompt">プロンプトをコピー</button><button class="btn alt full" id="openChatGPT">ChatGPTを開く ↗</button><p class="hint">コピーしたプロンプトをChatGPTに貼り付けて画像生成してください。</p></div></section>
<section id="page-presets" class="hidden"><div class="card stack"><h2>プリセット</h2><label>保存済みプリセット</label><select id="presetId"></select><div class="row wrap"><button class="btn grow" id="loadPreset">読み込む</button><button class="btn alt grow" id="overwritePreset">上書き</button><button class="btn danger grow" id="deletePreset">削除</button></div><hr><label>新しいプリセット名</label><input id="presetName" placeholder="例：すずか・自然光"><button class="btn full" id="addPreset">現在の設定を新規保存</button></div></section>
<section id="page-manage" class="hidden"><div class="card stack"><h2>カテゴリー・選択肢管理</h2><label>カテゴリー</label><select id="manageCat"></select><div class="row wrap"><button class="btn alt tiny" id="renameCat">カテゴリー名変更</button><button class="btn danger tiny" id="deleteCat">カテゴリー削除</button></div><label>新しいカテゴリー名</label><input id="newCatName" placeholder="例：アクセサリー"><button class="btn alt full" id="addCat">カテゴリー追加</button><hr><label>編集する選択肢</label><select id="manageItem"></select><label>選択肢の表示名</label><input id="itemName"><label>日本語プロンプト</label><textarea id="itemJa"></textarea><label>英語プロンプト</label><textarea id="itemEn"></textarea><div class="row"><button class="btn grow" id="saveItem">選択肢を保存</button><button class="btn danger" id="deleteItem">削除</button></div></div><div class="card stack"><h2>マスターシートの指示管理</h2><label>編集対象</label><select id="editSheet"></select><label>日本語指示</label><textarea id="editSheetJa"></textarea><label>英語指示</label><textarea id="editSheetEn"></textarea><button class="btn full" id="saveSheet">マスター指示を保存</button></div></section>
<section id="page-backup" class="hidden"><div class="card stack"><h2>保存・復元</h2><p class="hint">編集内容はこのブラウザ内に自動保存されます。端末間で自動同期されません。Safariのデータ削除に備え、JSONを別途保管してください。</p><div id="stats" class="notice"></div><button class="btn full" id="makeBackup">コンパクトJSONを作成</button><textarea id="backupText" readonly placeholder="ここにバックアップが表示されます"></textarea><button class="btn alt full" id="copyBackup">JSONをコピー</button><button class="btn alt full" id="downloadBackup">JSONファイルを保存</button><hr><label>JSONを貼り付けて復元</label><textarea id="restoreText" placeholder="Ver.4.5 / Ver.4.6 のJSONを貼り付け"></textarea><button class="btn full" id="restore">JSONから復元</button><p class="hint">復元すると現在のカテゴリー、プリセット、設定が置き換わります。</p></div></section>
<div id="notice" class="notice hidden" role="status"></div></main><nav class="tabs"><button data-tab="create" class="active">✦<br>作成</button><button data-tab="presets">▣<br>プリセット</button><button data-tab="manage">⚙<br>項目管理</button><button data-tab="backup">⇩<br>保存・復元</button></nav>
<script>
'use strict';
const INITIAL={"format":"prompt-builder","version":4.6,"categories":[{"id":"quality","name":"画質・画風","items":[["photo","フォトリアル","最高品質、超高精細、フォトリアル、自然な肌の質感、リアルなライティング","masterpiece, ultra detailed, photorealistic, natural skin texture, realistic lighting"],["anime","アニメ調","高品質な2Dイラスト、繊細な線画、セミフラットなセル塗り、統一された陰影","high quality 2D illustration, delicate line art, semi-flat cel shading, consistent shadows"]]},{"id":"hair","name":"髪型","items":[["bob","ショートボブ","ダークブラウンのショートボブ、自然な毛流れ","dark brown short bob, natural hair flow"],["long","ロングストレート","さらさらした黒髪のロングストレート","silky long straight black hair"]]},{"id":"expression","name":"表情","items":[["smile","優しい笑顔","柔らかな微笑み、リラックスした目元","gentle smile, relaxed eyes"],["neutral","無表情","落ち着いた自然な無表情","calm neutral expression"],["playful","いたずらっぽい","いたずらっぽい笑顔、遊び心のある表情","playful mischievous smile"]]},{"id":"clothing","name":"服装","items":[["casual","部屋着","白いオーバーサイズTシャツ、ダークグレーのショートパンツ","oversized white T-shirt, dark gray shorts"],["office","オフィス","白いブラウス、ダークスラックス、黒いパンプス","white blouse, dark trousers, black pumps"],["sweat","スウェット","グレーのオーバーサイズスウェット","oversized gray sweatshirt"]]},{"id":"pose","name":"ポーズ","items":[["sit","自然に座る","リラックスして自然に座っている","sitting naturally in a relaxed posture"],["stand","立ち姿","自然な姿勢で立っている","standing naturally"],["selfie","自撮り","スマートフォンを持った自然な自撮り","natural smartphone selfie"]]},{"id":"background","name":"背景","items":[["bedroom","寝室","落ち着いた寝室、自然な生活感","cozy lived-in bedroom"],["living","リビング","シンプルで居心地のよいリビング","simple cozy living room"],["plain","無地","シンプルな無地の背景","simple plain background"]]},{"id":"camera","name":"撮影・構図","items":[["mirror","鏡越し自撮り","全身鏡に映る自然な鏡越し自撮り","natural full-length mirror selfie"],["upper","上半身","上半身中心の自然な構図","natural upper body composition"],["full","全身","頭から足先まで入る全身構図","full body composition from head to toe"]]},{"id":"light","name":"照明","items":[["daylight","自然光","窓から差し込む柔らかな自然光","soft natural window light"],["warm","暖色照明","柔らかな暖色の室内照明","soft warm indoor lighting"]]},{"id":"negative","name":"ネガティブ","items":[["basic","基本","低品質、ぼやけ、不自然な人体構造、余分な指、余分な手足、文字、透かし","low quality, blurry, bad anatomy, extra fingers, extra limbs, text, watermark"]]}],"sheets":[{"id":"face","name":"顔・頭部マスター","ja":"正面、左右45度、左右90度の5方向の顔を配置する。すべて無表情、同じ髪型・照明・縮尺。顔の骨格、目、鼻、口、耳、固有の特徴を統一する。","en":"Five head views: front, left and right three-quarter, left and right profile. Consistent identity, neutral expression, hairstyle, lighting and scale."},{"id":"body","name":"全身・体型マスター","ja":"正面、左側面、背面、右側面、斜め45度の全身立ち姿を同じ縮尺で配置する。無地のTシャツとショートパンツ、裸足。身体比率を統一する。","en":"Five full-body standing views: front, left, back, right and three-quarter. Consistent scale and proportions, plain T-shirt, shorts, barefoot."},{"id":"expression","name":"表情マスター","ja":"3列×3行で無表情、微笑み、満面の笑顔、大笑い、驚き、怒り、悲しみ、照れ、いたずらっぽい笑顔を配置する。顔の角度・髪型・照明を統一する。","en":"3x3 grid of neutral, gentle smile, broad smile, laughter, surprise, anger, sadness, embarrassment and mischievous smile. Consistent face angle, hairstyle and lighting."},{"id":"details","name":"パーツ・特徴マスター","ja":"目、虹彩、眉、鼻、唇、耳、輪郭、髪の生え際と毛束、肌、ほくろなどを拡大表示する。同じ人物の特徴を維持する。","en":"Enlarged details of eyes, irises, eyebrows, nose, lips, ears, jawline, hairline, hair strands, skin and distinguishing marks."},{"id":"integrated","name":"統合マスター","ja":"中央に大きな正面顔、周囲に左右斜め顔と横顔、下部に正面の全身立ち姿を配置する。すべて同一人物、同じ画風に統一する。","en":"Large central front portrait, smaller three-quarter and profile views, and a full-body standing view. Consistent character identity and style."}],"presets":[{"id":"suzuka","name":"すずか・部屋着自撮り","mode":"normal","selected":{"quality":"photo","hair":"bob","expression":"smile","clothing":"casual","pose":"selfie","background":"bedroom","camera":"upper","light":"daylight","negative":"basic"},"lang":"ja","reference":true,"refMode":"face","extra":"","sheetId":"face","sheetStyle":"photo","sheetExtra":""},{"id":"saya","name":"さや・オフィス","mode":"normal","selected":{"quality":"anime","hair":"long","expression":"neutral","clothing":"office","pose":"stand","background":"plain","camera":"full","light":"daylight","negative":"basic"},"lang":"ja","reference":true,"refMode":"face","extra":"","sheetId":"face","sheetStyle":"anime","sheetExtra":""}],"settings":{"mode":"normal","selected":{},"lang":"ja","reference":true,"refMode":"face","extra":"","sheetId":"face","sheetStyle":"photo","sheetExtra":""},"serial":1};
const STORAGE_KEY='prompt-builder-v46-web';
const $=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x));
let data=clone(INITIAL), currentTab='create',manageCat='hair',manageItem='new',editSheet='face';
function message(msg){const n=$('notice');n.textContent=msg;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),3500)}
function valid(d){return d&&d.format==='prompt-builder'&&Array.isArray(d.categories)&&d.categories.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.items)&&c.items.every(i=>Array.isArray(i)&&i.length===4&&i.every(v=>typeof v==='string')))&&Array.isArray(d.sheets)&&d.sheets.every(s=>['id','name','ja','en'].every(k=>typeof s[k]==='string'))&&Array.isArray(d.presets)&&d.presets.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&p.selected&&typeof p.selected==='object')&&d.settings&&typeof d.settings==='object'&&['normal','master'].includes(d.settings.mode)&&['ja','en'].includes(d.settings.lang)&&['face','body'].includes(d.settings.refMode)&&['photo','anime'].includes(d.settings.sheetStyle)}
function normalize(d){let x=clone(d);x.version=4.6;x.serial=Number.isSafeInteger(x.serial)&&x.serial>0?x.serial:1;return x}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));$('saveStatus').textContent='保存済み'}catch(e){$('saveStatus').textContent='保存不可';message('自動保存に失敗しました。JSONバックアップを保管してください。')}}
function nextId(prefix){return prefix+'-'+(data.serial++)}
function opt(v,t){const o=document.createElement('option');o.value=v;o.textContent=t;return o}
function fillSelect(el,options,value){el.replaceChildren(...options.map(x=>opt(x[0],x[1])));el.value=value;if(el.selectedIndex<0&&el.options.length)el.selectedIndex=0}
function refText(s){if(!s.reference)return '';if(s.lang==='ja')return s.refMode==='body'?'添付した参照画像の人物と同一人物として生成してください。顔立ち、体型、身体比率を可能な限り維持し、髪型・表情・服装などの変更指定は優先してください。':'添付した参照画像の人物と同一人物として生成してください。顔の骨格、目、鼻、口、輪郭などを可能な限り維持し、髪型・表情・服装などの変更指定は優先してください。';return s.refMode==='body'?'Use the attached reference image to depict the same person. Preserve facial features and body proportions while prioritizing requested changes.':'Use the attached reference image to depict the same person. Preserve facial structure and identity while prioritizing requested changes.'}
function buildPrompt(){const s=data.settings,parts=[];if(s.reference)parts.push(refText(s));if(s.mode==='normal'){for(const cat of data.categories){if(cat.id==='negative')continue;const item=cat.items.find(i=>i[0]===s.selected?.[cat.id]);if(item&&item[s.lang==='ja'?2:3].trim())parts.push(item[s.lang==='ja'?2:3].trim())}if(s.extra.trim())parts.push(s.extra.trim());const negative=data.categories.find(c=>c.id==='negative');const neg=negative?.items.find(i=>i[0]===s.selected?.negative);if(neg){const t=neg[s.lang==='ja'?2:3].trim();if(t)parts.push((s.lang==='ja'?'ネガティブプロンプト：':'Negative prompt: ')+t)}}else{const sheet=data.sheets.find(x=>x.id===s.sheetId);if(sheet){parts.push(s.lang==='ja'?`「${sheet.name}」を作成してください。`:`Create a ${sheet.name} reference sheet.`);if(sheet[s.lang].trim())parts.push(sheet[s.lang].trim())}parts.push(s.sheetStyle==='photo'?(s.lang==='ja'?'最高品質、フォトリアル、自然な肌の質感、リアルなライティング。':'High-quality photorealism, natural skin texture, realistic lighting.'):(s.lang==='ja'?'高品質な2Dイラスト、繊細な線画、セミフラットなセル塗り、統一された陰影。':'High-quality 2D illustration, delicate line art, semi-flat cel shading, consistent shadows.'));parts.push(s.lang==='ja'?'無地のライトグレー背景、整理された比較用レイアウト、不要な文字や装飾なし。':'Plain light gray background, clean reference layout, no unnecessary text or decoration.');if(s.sheetExtra.trim())parts.push(s.sheetExtra.trim())}return parts.filter(Boolean).join('\n\n')}
function renderOutput(){const text=buildPrompt();$('output').textContent=text||'項目を選択してください。';$('promptCount').textContent=text.length+'文字'}
function renderCreate(){const s=data.settings;$('mode').value=s.mode;$('lang').value=s.lang;$('reference').checked=s.reference;$('refMode').value=s.refMode;$('refArea').classList.toggle('hidden',!s.reference);$('normalArea').classList.toggle('hidden',s.mode!=='normal');$('masterArea').classList.toggle('hidden',s.mode!=='master');$('extra').value=s.extra;$('sheetExtra').value=s.sheetExtra;$('sheetStyle').value=s.sheetStyle;fillSelect($('sheetId'),data.sheets.map(x=>[x.id,x.name]),s.sheetId);const box=$('selectors');box.replaceChildren();for(const cat of data.categories){const wrap=document.createElement('div'),lab=document.createElement('label'),select=document.createElement('select');lab.textContent=cat.name;fillSelect(select,[['none','なし'],...cat.items.map(i=>[i[0],i[1]])],s.selected?.[cat.id]||'none');select.onchange=()=>{s.selected[cat.id]=select.value;renderOutput();save()};wrap.append(lab,select);box.append(wrap)}renderOutput()}
function renderPresets(){fillSelect($('presetId'),data.presets.map(p=>[p.id,p.name]),$('presetId').value)}
function renderManage(){if(!data.categories.some(c=>c.id===manageCat))manageCat=data.categories[0]?.id||'';fillSelect($('manageCat'),data.categories.map(c=>[c.id,c.name]),manageCat);const cat=data.categories.find(c=>c.id===manageCat);if(!cat)return;fillSelect($('manageItem'),[['new','＋ 新しい選択肢'],...cat.items.map(i=>[i[0],i[1]])],manageItem);manageItem=$('manageItem').value;const item=cat.items.find(i=>i[0]===manageItem);$('itemName').value=item?.[1]||'';$('itemJa').value=item?.[2]||'';$('itemEn').value=item?.[3]||'';$('deleteItem').disabled=manageItem==='new';if(!data.sheets.some(s=>s.id===editSheet))editSheet=data.sheets[0]?.id||'';fillSelect($('editSheet'),data.sheets.map(s=>[s.id,s.name]),editSheet);renderSheetEditor()}
function renderSheetEditor(){const s=data.sheets.find(s=>s.id===editSheet);$('editSheetJa').value=s?.ja||'';$('editSheetEn').value=s?.en||''}
function stats(){const compact=JSON.stringify(data),pretty=JSON.stringify(data,null,2),bytes=new Blob([compact]).size,prettyBytes=new Blob([pretty]).size;return `カテゴリー：${data.categories.length}　選択肢：${data.categories.reduce((n,c)=>n+c.items.length,0)}　プリセット：${data.presets.length}\nJSON容量：${(bytes/1024).toFixed(1)} KB　削減率：${(100*(1-bytes/prettyBytes)).toFixed(1)}%`}
function renderBackup(){$('stats').textContent=stats()}
function render(){renderCreate();renderPresets();renderManage();renderBackup()}
function switchTab(tab){currentTab=tab;for(const t of ['create','presets','manage','backup'])$('page-'+t).classList.toggle('hidden',t!==tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='backup')renderBackup();window.scrollTo(0,0)}
function updateSetting(k,v){data.settings[k]=v;renderOutput();save()}
function downloadText(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function initEvents(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('mode').onchange=e=>{data.settings.mode=e.target.value;renderCreate();save()};$('lang').onchange=e=>updateSetting('lang',e.target.value);$('reference').onchange=e=>{data.settings.reference=e.target.checked;$('refArea').classList.toggle('hidden',!e.target.checked);renderOutput();save()};$('refMode').onchange=e=>updateSetting('refMode',e.target.value);$('extra').oninput=e=>updateSetting('extra',e.target.value);$('sheetExtra').oninput=e=>updateSetting('sheetExtra',e.target.value);$('sheetId').onchange=e=>updateSetting('sheetId',e.target.value);$('sheetStyle').onchange=e=>updateSetting('sheetStyle',e.target.value);$('copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(buildPrompt());message('プロンプトをコピーしました')}catch(e){message('コピーできませんでした。SafariのHTTPSページから試してください。')}};$('openChatGPT').onclick=()=>window.open('https://chatgpt.com/','_blank','noopener');$('addPreset').onclick=()=>{const name=$('presetName').value.trim();if(!name)return message('プリセット名を入力してください');data.presets.push({id:nextId('preset'),name,...clone(data.settings)});$('presetName').value='';renderPresets();save();message('プリセットを保存しました')};$('loadPreset').onclick=()=>{const p=data.presets.find(p=>p.id===$('presetId').value);if(!p)return;data.settings={...clone(INITIAL.settings),...clone(p),selected:clone(p.selected||{})};delete data.settings.id;delete data.settings.name;renderCreate();save();message('プリセットを読み込みました')};$('overwritePreset').onclick=()=>{const p=data.presets.find(p=>p.id===$('presetId').value);if(!p)return;if(!confirm(`「${p.name}」を上書きしますか？`))return;Object.assign(p,clone(data.settings));save();message('上書きしました')};$('deletePreset').onclick=()=>{const id=$('presetId').value;if(!id)return;if(!confirm('プリセットを削除しますか？'))return;data.presets=data.presets.filter(p=>p.id!==id);renderPresets();save();message('削除しました')};$('manageCat').onchange=e=>{manageCat=e.target.value;manageItem='new';renderManage()};$('manageItem').onchange=e=>{manageItem=e.target.value;renderManage()};$('renameCat').onclick=()=>{const cat=data.categories.find(c=>c.id===manageCat);if(!cat)return;const name=prompt('新しいカテゴリー名',cat.name)?.trim();if(!name)return;cat.name=name;render();save()};$('addCat').onclick=()=>{const name=$('newCatName').value.trim();if(!name)return message('カテゴリー名を入力してください');manageCat=nextId('category');data.categories.push({id:manageCat,name,items:[]});manageItem='new';$('newCatName').value='';render();save();message('カテゴリーを追加しました')};$('deleteCat').onclick=()=>{if(!confirm('このカテゴリーと全選択肢を削除しますか？'))return;data.categories=data.categories.filter(c=>c.id!==manageCat);delete data.settings.selected[manageCat];manageCat=data.categories[0]?.id||'';manageItem='new';render();save();message('カテゴリーを削除しました')};$('saveItem').onclick=()=>{const cat=data.categories.find(c=>c.id===manageCat);if(!cat)return;const name=$('itemName').value.trim(),ja=$('itemJa').value,en=$('itemEn').value;if(!name)return message('選択肢の表示名を入力してください');const existing=cat.items.find(i=>i[0]===manageItem);if(existing){existing.splice(1,3,name,ja,en)}else{manageItem=nextId('custom');cat.items.push([manageItem,name,ja,en])}render();save();message('選択肢を保存しました')};$('deleteItem').onclick=()=>{const cat=data.categories.find(c=>c.id===manageCat);if(!cat||manageItem==='new')return;if(!confirm('この選択肢を削除しますか？'))return;cat.items=cat.items.filter(i=>i[0]!==manageItem);if(data.settings.selected[manageCat]===manageItem)delete data.settings.selected[manageCat];manageItem='new';render();save();message('削除しました')};$('editSheet').onchange=e=>{editSheet=e.target.value;renderSheetEditor()};$('saveSheet').onclick=()=>{const sheet=data.sheets.find(s=>s.id===editSheet);if(!sheet)return;sheet.ja=$('editSheetJa').value;sheet.en=$('editSheetEn').value;renderOutput();save();message('マスター指示を保存しました')};$('makeBackup').onclick=()=>{$('backupText').value=JSON.stringify(data);renderBackup();message('JSONを作成しました')};$('copyBackup').onclick=async()=>{if(!$('backupText').value)$('backupText').value=JSON.stringify(data);try{await navigator.clipboard.writeText($('backupText').value);message('JSONをコピーしました')}catch(e){message('コピーできませんでした')}};$('downloadBackup').onclick=()=>downloadText(JSON.stringify(data),'prompt-builder-backup.json');$('restore').onclick=()=>{try{const restored=JSON.parse($('restoreText').value);if(!valid(restored))throw Error('形式が一致しません');if(!confirm('現在のデータをJSONの内容で置き換えますか？'))return;data=normalize(restored);manageCat=data.categories[0]?.id||'';manageItem='new';editSheet=data.sheets[0]?.id||'';render();save();message('復元しました')}catch(e){message('復元できません：'+e.message)}}}
try{const stored=localStorage.getItem(STORAGE_KEY);if(stored){const parsed=JSON.parse(stored);if(valid(parsed))data=normalize(parsed)}}catch(e){console.warn('保存データを読み込めません',e)}
initEvents();render();save();
</script></body></html>
